spring.application.name=apply-api-spring

server.port=${SERVER_PORT}

logging.level.root=error
logging.level.com.humanressources=info
logging.level.org.springframework.boot.orm.jpa.hibernate=info
logging.level.org.springframework.boot.web.embedded.tomcat=info

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME}

spring.data.jpa.repositories.enabled=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
